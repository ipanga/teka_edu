# Staging deployment: develop -> Supabase DEV migrations -> Vercel staging container -> smoke.
#
# Disabled until the owner has configured the external services: set the repository
# variable STAGING_DEPLOY_ENABLED=true (docs/ENVIRONMENT_SETUP.md). Until then this workflow
# still runs CI on every push to develop and skips the deploy job.
# See docs/DEPLOYMENT.md for the full lifecycle, failure handling and rollback.
name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialise deployments. Never cancel a run in progress: it may be applying migrations.
  # A newer push waits; older queued runs are superseded automatically.
  group: deploy-staging
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 59.16.0
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate Supabase DEV, deploy Vercel staging, smoke test
    needs: ci
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets (names only, values are never printed)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret $name in the 'staging' environment"; missing=1; fi
          done
          exit "$missing"

      # ---- 1. Database: must succeed before any application deployment ----------------
      - uses: supabase/setup-cli@v3
      - name: Link Supabase DEV project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Show migration state and pending changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked
          supabase db push --dry-run
      - name: Apply migrations to Supabase DEV
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes

      # ---- 2. Application: Vercel builds Dockerfile.vercel remotely --------------------
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      # Before the deploy, not after it: the registry prune below runs from this checkout.
      - run: npm ci
      # Vercel makes the FIRST deployment of a new project a production deployment even
      # without --prod (docs: /docs/cli/deploy#prod). Staging must never be that deployment.
      - name: Refuse to deploy into a project without any deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          count="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&limit=1" \
            | jq '.deployments | length')"
          if [[ "$count" -lt 1 ]]; then
            echo "::error::The Vercel project has no deployment yet: Vercel would make this one production. Create the first (production) deployment deliberately first; see docs/DEPLOYMENT.md."
            exit 1
          fi
      # The container registry holds 50 images on Hobby and deletes none of them, so it fills up
      # and then the *push* below is rejected — which blocks develop, because every following
      # merge re-triggers this same deploy. Prune before pushing, never after (ISSUE-011).
      # The policy and its safety rules live in lib/deploy/registry-retention.ts and are unit
      # tested; this step only supplies the registry contents and what must survive.
      - name: Prune superseded container images
        env:
          # A credential of its own: the deploy token is project-scoped and the registry endpoint
          # answers 404 under it. The script falls back to VERCEL_TOKEN while this secret does
          # not exist yet, so the step degrades to a warning rather than breaking.
          VERCEL_VCR_TOKEN: ${{ secrets.VERCEL_VCR_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_URL: ${{ vars.STAGING_DOMAIN != '' && format('https://{0}', vars.STAGING_DOMAIN) || '' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run registry:prune
      - name: Deploy to Vercel (staging)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # "staging" when a Vercel Custom Environment exists (Pro plan); empty = Preview.
          VERCEL_TARGET: ${{ vars.VERCEL_STAGING_TARGET }}
        run: |
          target="${VERCEL_TARGET:-preview}"
          if [[ "$target" == "production" ]]; then
            echo "::error::The staging workflow must never deploy to production."
            exit 1
          fi
          url="$(vercel deploy --yes --target="$target" \
            --env NEXT_PUBLIC_GIT_SHA="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $url"
      # REST API rather than `vercel inspect` / `vercel alias`: those CLI commands also call
      # user-level endpoints that a project-scoped token may not use ("User not found").
      - name: Verify the deployment target is not production
        id: target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TARGET: ${{ vars.VERCEL_STAGING_TARGET }}
        run: |
          dep="$(curl -sS --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEPLOY_URL#https://}?teamId=${VERCEL_ORG_ID}")"
          actual="$(jq -r '.target // "preview"' <<<"$dep")"   # preview deployments have target null
          expected="${VERCEL_TARGET:-preview}"
          echo "Vercel deployment $(jq -r .id <<<"$dep"): target=$actual (expected: $expected), state=$(jq -r .readyState <<<"$dep")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Vercel created a '$actual' deployment from the staging workflow. Stop and investigate (docs/DEPLOYMENT.md)."
            exit 1
          fi
          echo "id=$(jq -r .id <<<"$dep")" >> "$GITHUB_OUTPUT"
      - name: Assign stable staging domain
        if: vars.STAGING_DOMAIN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.target.outputs.id }}
          STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
        run: |
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"alias\":\"${STAGING_DOMAIN}\"}" \
            "https://api.vercel.com/v2/deployments/${DEPLOYMENT_ID}/aliases?teamId=${VERCEL_ORG_ID}" \
            | jq -r '"Aliased \(.alias) -> \(.deploymentId // "deployment")"'

      # ---- 3. Smoke tests against the exact deployment ---------------------------------
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_APP_ENV: staging
          # The environment's own Supabase project ref (DEV for staging, PROD for production).
          EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Staging deployment: ${JOB_STATUS}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DEPLOY_URL:-not deployed}"
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo ""
              echo "**Deployment unhealthy or incomplete: investigate before promoting to main.**"
              echo "See docs/DEPLOYMENT.md, section Common deployment failures."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
