# Prepared only: register on the default branch before a separately authorized develop dispatch.
name: Verify alwaysdata API (authenticated read-only)
on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: Confirm site 1083502 GET-only verification with deployment disabled
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: verify-alwaysdata-api
  cancel-in-progress: false
env:
  DIAGNOSTIC_READ_ONLY: "true"
  DIAGNOSTIC_ALLOW_DEPLOYMENT: "false"
  API_VERIFICATION_READ_ONLY_ACK: ${{ inputs.confirm_read_only }}
  ALWAYSDATA_STAGING_DEPLOY_ENABLED: ${{ vars.ALWAYSDATA_STAGING_DEPLOY_ENABLED }}
jobs:
  disabled:
    name: Validate disabled deployment before Environment access
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Require develop, explicit acknowledgement and actual repository switch disabled
        run: node scripts/alwaysdata/verify-api.mjs guard
  verify:
    name: GET-only site identity with existing staging API secret
    needs: disabled
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Repeat guard before authenticated GET and retain only sanitized result
        env:
          ALWAYSDATA_API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
        run: node scripts/alwaysdata/verify-api.mjs inspect > "$RUNNER_TEMP/alwaysdata-api-verification.json"
      - name: Retain sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: alwaysdata-api-verification-${{ github.sha }}
          path: ${{ runner.temp }}/alwaysdata-api-verification.json
          retention-days: 14
