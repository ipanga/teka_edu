# Production deployment: main -> full CI -> Supabase PROD migrations -> Vercel production
# container -> smoke test.
#
# Disabled until the owner has configured the external services: set the repository
# variable PRODUCTION_DEPLOY_ENABLED=true (docs/ENVIRONMENT_SETUP.md).
# Manual approval: add "Required reviewers" to the GitHub 'production' environment.
# Rollback: docs/DEPLOYMENT.md (application: `vercel rollback`; database: forward fix).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Strictly serialised: production migrations must never overlap or be interrupted.
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 59.16.0
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Migrate Supabase PROD, deploy Vercel production, smoke test
    needs: ci
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets (names only, values are never printed)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret $name in the 'production' environment"; missing=1; fi
          done
          exit "$missing"

      # ---- 1. Database: must succeed before any application deployment ----------------
      - uses: supabase/setup-cli@v3
      - name: Link Supabase PROD project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Verify migration state and show pending changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase migration list --linked
          supabase db push --dry-run
      - name: Apply migrations to Supabase PROD
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes

      # ---- 2. Application: Vercel builds Dockerfile.vercel remotely --------------------
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_GIT_SHA="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $GITHUB_SHA to $url"

      # ---- 3. Smoke test against the exact deployment ----------------------------------
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Production smoke test
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_APP_ENV: production
          # The environment's own Supabase project ref (DEV for staging, PROD for production).
          EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Summary
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production deployment: ${JOB_STATUS}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${DEPLOY_URL:-not deployed}"
            if [[ "$JOB_STATUS" != "success" ]]; then
              echo ""
              echo "**PRODUCTION DEPLOYMENT UNHEALTHY OR INCOMPLETE: investigate now.**"
              echo "Application rollback: \`vercel rollback\` (docs/DEPLOYMENT.md, section Rollback)."
              echo "Never run destructive rollback SQL automatically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
